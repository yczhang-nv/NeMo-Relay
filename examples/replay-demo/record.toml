version = 1

[[components]]
kind = "adaptive"
enabled = true

[components.config]
version = 1

[components.config.response_cache]
namespace = "codex-tool-replay-demo"
cache_nondeterministic = true

[components.config.response_cache.backend]
kind = "in_memory"

[components.config.response_cache.replay]
mode = "record"
output_path = "examples/replay-demo/artifacts/recording.json"
capture_requests = true

[components.config.response_cache.replay.tools]
mode = "live"
